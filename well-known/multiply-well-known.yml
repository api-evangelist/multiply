host: https://www.gomultiply.com
summary: >-
  Multiply serves NO /.well-known/ discovery surface on any host it controls — no security.txt,
  no OIDC or OAuth authorization-server metadata, no api-catalog, no ai-plugin.json, and no A2A
  agent card at either the 1.0 (/.well-known/agent-card.json) or legacy (/.well-known/agent.json)
  path. No WellKnown or SecurityTxt pointer is emitted in apis.yml, because every /.well-known/
  path returned 404. The one machine-readable document Multiply DOES publish is /llms.txt, saved
  verbatim to llms/multiply-llms.txt.
notes: >-
  SOFT-404 WARNING — www.gomultiply.com is a client-side SPA (Vite/React on Vercel behind
  Cloudflare) that answers ANY unknown application route with a 200 and the same 7,655-byte HTML
  shell: /docs, /api-docs, /terms and /mcp all return that shell and are NOT real pages. The
  /.well-known/ prefix is exempt from that catch-all — a control probe of
  /.well-known/zzz-nonexistent-abc123 returned a hard 404 with the 9-byte body "Not found",
  identical to the 404s recorded below — so the .well-known misses here are real misses and the
  200s on SPA routes are recorded as shell responses, not documents.
control_probe:
  path: /.well-known/zzz-nonexistent-abc123
  status: 404
  body: Not found
  conclusion: no catch-all on the /.well-known/ prefix; recorded 404s are genuine
