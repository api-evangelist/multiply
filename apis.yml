name: Multiply
description: >-
  Multiply is an AI-native media agency built specifically for B2B companies,
  pairing human paid-media strategists with a fleet of 25+ specialized AI agents
  to run and continuously optimize LinkedIn and Google Search advertising. Its
  "Self-Learning Advertising" platform plugs into a company's own data — sales
  call recordings (e.g. Gong), CRM closed-won outcomes, case studies, website
  content, competitive kill sheets and product documentation — and runs hundreds
  of structured ad experiments that refine audiences, copy and creative from
  real revenue signals. Multiply is a managed service (not a self-serve API
  product), founded by Matt Jayson (ex-Google, ex-Brex) and Ashish Warty
  (ex-HackerOne SVP Engineering, ex-Dropbox), and raised $9.5M led by Mayfield
  in March 2026. It was added to the API Evangelist network as a Mayfield
  portfolio company; two enrichment passes confirmed it publishes no public API,
  developer documentation, SDK, or /.well-known/ discovery surface. It does publish
  an llms.txt and three named service tiers — Growth (from $6K/mo), Scale (from
  $12K/mo) and Enterprise — priced against monthly ad spend rather than API usage.
