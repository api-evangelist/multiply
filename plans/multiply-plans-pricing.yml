description: >-
  Multiply publishes three named tiers for its managed B2B paid-media service — Growth, Scale and
  Enterprise. Two of the three carry a published starting price and a monthly media-spend band;
  Enterprise is quoted. These are AGENCY SERVICE plans, not API plans: Multiply sells a managed
  media program (LinkedIn, Google and ChatGPT Ads) run by a dedicated strategist on top of its
  Self-Learning Advertising platform. There is no developer plan, no free tier, no self-serve
  signup and no metered API pricing, because Multiply publishes no public API.
notes: >-
  PROVENANCE — www.gomultiply.com is a client-side React SPA, so /pricing returns an empty HTML
  shell to any fetch. The tier names, prices, periods and feature bullets recorded below were read
  verbatim from the site's own published JavaScript bundle
  (https://www.gomultiply.com/assets/index-DMfYoqyR.js), which is the delivery mechanism for the
  pricing page itself. Nothing here is inferred: every price string, spend band and feature line is
  a literal from that bundle. The site's FAQ adds the qualifier "Pricing is tailored to your goals
  and scale rather than a fixed package. As a guide, Multiply is the right fit for teams spending
  upwards of $10,000/month on paid ads", so the figures below are floors, not rate cards. The
  bundle hash is part of the URL and will change on the next deploy.
